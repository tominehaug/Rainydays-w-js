<!doctype html>
<html lang="en">
  <head>
    <title>Products | Rainydays</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All Rainydays' products." />
    <base href="/Rainydays-w-js/" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="assets/android-chrome-512x512.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="assets/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon-16x16.png"
    />
    <!--icon for hamburger menu-->
    <script
      src="https://kit.fontawesome.com/4b71fec88a.js"
      crossorigin="anonymous"
    ></script>
    <!--stylesheet-->
    <link href="css/product-list.css" rel="stylesheet" />
    <!--font sources-->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Montserrat+Subrayada:wght@400;700&family=Open+Sans:wght@300;400&display=swap");
    </style>
  </head>
  <body>
    <header>
      <a href="index.html"
        ><img alt="Rainydays logo" src="images/rainydays-logo.png" class="logo"
      /></a>
      <input type="checkbox" id="hamburger-menu" />
      <label for="hamburger-menu" class="hamburger"
        ><i class="fa-solid fa-bars"></i
      ></label>
      <nav>
        <ul>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="sign-in.html">Sign in</a></li>
          <li>
            <a href="checkout/index.html" class="cartIcon"
              ><img src="" alt="go to shopping cart" class="cart-icon"
            /></a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>All products</h1>
      <aside>
        <h2>Filter</h2>
        <input type="checkbox" id="womenCheckbox" name="women" value="women" />
        <label for="women">Women</label><br />
        <input type="checkbox" id="menCheckbox" name="men" value="men" />
        <label for="men">Men</label>
      </aside>
      <section>
        <div id="productlist"></div>
      </section>
      <p class="page">Page 1/1</p>
    </main>
    <footer>
      <ul>
        <li><i class="fa-brands fa-facebook"></i></li>
        <li><i class="fa-brands fa-instagram"></i></li>
        <li><i class="fa-brands fa-youtube"></i></li>
      </ul>
    </footer>
    <!--JavaScript-->
    <script defer src="js/product-list.js"></script>
    <script defer src="js/cart-icon-functionality.js"></script>
  </body>
</html>
